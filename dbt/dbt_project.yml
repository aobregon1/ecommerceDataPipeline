name: 'ecom_project'
version: '1.0.0'

profile: ecom_project

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

require-dbt-version: ">=1.5.0"
packages-install-path: "dbt_packages"

models:
  ecom_project:
    # Default behavior for models
    +materialized: view

    stage:
      +materialized: table
      +schema: stage

    mart:
      +materialized: table
      +schema: mart